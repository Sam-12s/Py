name: Update then Run Scrapers

on:
  workflow_dispatch:

jobs:

  # =========================
  # JOB 1 — UPDATE PREFIXES
  # =========================
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (update job)
        run: |
          npm install
          npx playwright install chromium

      - name: Run prefix generator
        run: node prefix_generator.js

      - name: Upload updated scrappers
        uses: actions/upload-artifact@v4
        with:
          name: updated-scrappers
          path: |
            scrapper.js


  # =========================
  # JOB 2 — RUN SCRAPPERS
  # =========================
  run_scrappers:
    needs: update
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 18
      matrix:
        scraper: [1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated scrappers
        uses: actions/download-artifact@v4
        with:
          name: updated-scrappers
          path: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (scraper job)
        run: |
          npm install
          npx playwright install chromium

      # 🧪 SAFETY CHECK
      - name: Show PREFIXES used
        run: |
          grep -n "const PREFIXES" scrapper${{ matrix.scraper }}.js | head -n 1

      - name: Run scrapper${{ matrix.scraper }}
        run: node --max-old-space-size=4096 scrapper${{ matrix.scraper }}.js
