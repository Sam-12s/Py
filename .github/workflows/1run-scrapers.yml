name: Update then Run Scrapers1

on:
  workflow_dispatch:

jobs:

  run_A1:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 18
      matrix:
        scraper: [1,2]

    steps:

      # ✅ THIS IS MISSING IN YOUR FILE
      - uses: actions/checkout@v4

      - name: Create service account file
        run: echo '${{ secrets.GDRIVE_KEY }}' > service-account.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          npm install
          npx playwright install chromium

      - run: node --max-old-space-size=4096 scrapper${{ matrix.scraper }}.js
