name: Prefix + Scrapers Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefix-generator:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Run prefix generator
        run: node prefix_generator.js

      - name: Commit updated prefixes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update prefixes" || echo "No changes"
          git push

  scrapers:
    needs: prefix-generator
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scraper: [scrapper.js]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Run scraper
        run: node --max-old-space-size=5120 ${{ matrix.scraper }}
