name: Update AV Scripts Only

on:
  workflow_dispatch:

# Prevent overlapping update runs
concurrency:
  group: update-av-scripts
  cancel-in-progress: true

# REQUIRED for git push
permissions:
  contents: write

jobs:
  update_only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Update AV scripts
        run: python scripts/update.py

      # ✅ COMMIT + PUSH (SAFE)
      - name: Commit updated scripts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git rebase origin/main

          git add scripts/AV*.py
          git commit -m "Auto-update AV prefixes" || echo "No changes to commit"
          git push

      # 📦 ARTIFACT (DOWNLOADABLE)
      - name: Upload updated AV scripts (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: updated-av-scripts
          path: scripts/AV*.py
