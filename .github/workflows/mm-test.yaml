name: mitm-test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install mitmproxy httpx

      - name: Run mitmproxy + script
        run: |
          mitmdump -p 8080 -w flows.mitm &
          sleep 2
          python test.py

      - name: Upload flows
        uses: actions/upload-artifact@v4
        with:
          name: mitm-flows
          path: flows.mitm
