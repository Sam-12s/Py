name: Run Scrapers

on:
  push:
    paths:
      - "scrapper*.js"          # any change to scrapper files
      - "prefix_generator.js"   # optionally track prefix file changes
      - "package.json"          # track dependency changes

permissions:
  contents: read   # scrapers just need the latest code

jobs:
  scrapers:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scraper: [scrapper.js] # etc.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Run scraper
        run: node --max-old-space-size=5120 ${{ matrix.scraper }}
